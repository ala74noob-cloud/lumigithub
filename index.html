<style>
html,body{margin:0;background:#12211F;}
:root{
  --ink:#12211F;
  --felt:#1B302C;
  --felt-hi:#24413B;
  --bone:#F4EDDF;
  --bone-2:#E5DAC5;
  --vermilion:#D8342A;
  --brass:#C6A257;
  --jade:#6FA89B;
  --dim:#93ABA4;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
.wrap{
  min-height:100vh;background:var(--ink);color:var(--bone);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding:20px 16px 56px;
}
.shell{max-width:520px;margin:0 auto;}

/* ---------- header ---------- */
.mast{display:flex;align-items:flex-end;gap:12px;margin-bottom:4px;}
.seal{
  width:44px;height:44px;flex:none;border-radius:9px;
  background:var(--vermilion);color:var(--bone);
  display:grid;place-items:center;font-family:var(--serif);
  font-size:26px;line-height:1;padding-bottom:2px;
  box-shadow:0 6px 18px rgba(216,52,42,.32);
}
h1{
  font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.05;
  margin:0;letter-spacing:.06em;
}
.kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
  color:var(--brass);text-transform:uppercase;margin:0 0 6px;
}
.sub{color:var(--dim);font-size:12.5px;line-height:1.7;margin:12px 0 0;}
.rule{height:1px;background:linear-gradient(90deg,var(--brass),transparent);margin:18px 0 0;opacity:.55;}

/* ---------- nav ---------- */
.nav{display:flex;gap:6px;margin:16px 0 20px;}
.nav button{
  flex:1;padding:9px 8px;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-size:13px;letter-spacing:.05em;
  border:1px solid rgba(198,162,87,.3);background:transparent;color:var(--dim);
  transition:.18s;
}
.nav button[data-on="1"]{background:var(--felt);color:var(--bone);border-color:var(--brass);}
.nav button:hover{color:var(--bone);}

/* ---------- filters ---------- */
.fbox{border:1px solid rgba(198,162,87,.22);border-radius:12px;padding:14px;background:rgba(27,48,44,.4);}
.fhead{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;background:none;border:0;padding:0;cursor:pointer;color:inherit;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--brass);
}
.flabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);margin:14px 0 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  border:1px solid rgba(244,237,223,.18);background:transparent;color:var(--dim);
  border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;
  font-family:var(--sans);transition:.15s;line-height:1.3;
}
.chip:hover{border-color:rgba(244,237,223,.42);color:var(--bone);}
.chip[data-on="1"]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
.chip[data-all="1"][data-on="1"]{background:var(--brass);border-color:var(--brass);color:#1a1408;}
.fcount{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:14px;}
.fcount b{color:var(--bone);font-weight:600;}

/* ---------- dice tray ---------- */
.tray{
  margin:22px 0 0;height:210px;border-radius:16px;position:relative;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 26%,var(--felt-hi) 0%,#162925 72%);
  box-shadow:inset 0 0 0 1px rgba(198,162,87,.34),inset 0 22px 56px rgba(0,0,0,.55);
}
.stage{perspective:760px;width:104px;height:104px;}
.cube{
  width:104px;height:104px;position:relative;transform-style:preserve-3d;
  transition:transform 1250ms cubic-bezier(.16,.86,.28,1);
}
@media (prefers-reduced-motion:reduce){.cube{transition-duration:160ms;}}
.face{
  position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(150deg,#FBF6EC 0%,var(--bone) 42%,var(--bone-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.09), inset 0 -8px 16px rgba(0,0,0,.09);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:13px;gap:3px;
}
.pip{width:14px;height:14px;border-radius:50%;align-self:center;justify-self:center;
  background:#1d1d1d;box-shadow:inset 0 1.5px 2px rgba(255,255,255,.28);}
.pip.red{background:var(--vermilion);}
.pip.big{width:26px;height:26px;}
.shadow{
  position:absolute;bottom:34px;width:96px;height:14px;border-radius:50%;
  background:rgba(0,0,0,.45);filter:blur(9px);transition:.5s;
}
.trayTag{
  position:absolute;top:12px;left:14px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.2em;color:rgba(198,162,87,.6);
}

/* ---------- big button ---------- */
.roll{
  width:100%;margin-top:16px;padding:17px;border-radius:12px;border:0;cursor:pointer;
  background:var(--vermilion);color:#fff;font-family:var(--serif);
  font-size:19px;letter-spacing:.34em;text-indent:.34em;font-weight:700;
  box-shadow:0 10px 26px rgba(216,52,42,.3);transition:.16s;
}
.roll:hover{filter:brightness(1.08);}
.roll:active{transform:translateY(2px);box-shadow:0 4px 12px rgba(216,52,42,.3);}
.roll:disabled{opacity:.5;cursor:wait;}

/* ---------- result ---------- */
.card{
  margin-top:20px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(198,162,87,.3);background:#152724;
  animation:rise .46s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.card{animation:none;}}

/* 店面招牌 —— 印章徽标 + 遮阳棚，代替店面照片 */
.hero{
  position:relative;overflow:hidden;
  padding:30px 22px 24px;
  display:flex;flex-direction:column;align-items:center;gap:13px;
  text-align:center;border-bottom:1px solid rgba(198,162,87,.28);
}
.hero::before{
  content:"";position:absolute;top:0;left:0;right:0;height:9px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 15px,transparent 15px 30px);
  opacity:.55;pointer-events:none;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 88% at 50% -14%,rgba(255,255,255,.16),transparent 62%);
}
.heroTop{
  position:relative;z-index:1;width:100%;
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:rgba(255,255,255,.82);
}
.heroKind{display:inline-flex;align-items:center;gap:5px;letter-spacing:.1em;}
.heroSeal{
  position:relative;z-index:1;
  width:66px;height:66px;border-radius:17px;flex:none;
  display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:34px;color:#fff;line-height:1;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 10px 22px rgba(0,0,0,.28);
  text-shadow:0 2px 10px rgba(0,0,0,.3);
}
.heroName{
  position:relative;z-index:1;margin:0;
  font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.28;
  letter-spacing:.02em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.38);
  max-width:100%;word-break:break-word;
}
.heroMall{
  position:relative;z-index:1;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:rgba(255,255,255,.86);
}
.body{padding:18px 16px 16px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;}
.tag{
  font-size:11.5px;padding:4px 10px;border-radius:999px;
  border:1px solid rgba(111,168,155,.45);color:var(--jade);font-family:var(--sans);
}
.tag.mall{border-color:rgba(198,162,87,.45);color:var(--brass);}
.blurb{font-size:14px;line-height:1.8;color:var(--bone);margin:14px 0 0;opacity:.92;}
.addr{
  font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--dim);
  margin:12px 0 0;padding-left:15px;position:relative;word-break:break-all;
}
.addr::before{content:"\25C9";position:absolute;left:0;top:1px;color:var(--brass);font-size:9px;}

.scoreRow{display:flex;align-items:center;gap:11px;margin:16px 0 0;
  padding-top:14px;border-top:1px solid rgba(198,162,87,.2);}
.scoreNum{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--brass);line-height:1;font-variant-numeric:tabular-nums;}
.bars{display:flex;gap:3px;}
.bar{width:15px;height:5px;border-radius:2px;background:rgba(198,162,87,.2);}
.bar[data-on="1"]{background:var(--brass);}
.scoreLbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-left:auto;text-align:right;line-height:1.5;}

.acts{display:flex;gap:8px;margin:16px 0 0;}
.act{
  flex:1;padding:12px 6px;border-radius:9px;cursor:pointer;font-size:13px;
  font-family:var(--sans);border:1px solid rgba(244,237,223,.25);
  background:transparent;color:var(--bone);transition:.16s;text-align:center;
  text-decoration:none;display:block;
}
.act:hover{background:rgba(244,237,223,.09);}
.act[data-fav="1"]{background:var(--vermilion);border-color:var(--vermilion);color:#fff;font-weight:600;}
.links{display:flex;gap:8px;margin:8px 0 0;}
.links .act{font-size:12px;padding:10px 6px;color:var(--dim);}
.links .act:hover{color:var(--bone);}

/* ---------- empty / favorites ---------- */
.empty{
  border:1px dashed rgba(198,162,87,.32);border-radius:12px;padding:28px 20px;
  text-align:center;color:var(--dim);font-size:13.5px;line-height:1.9;margin-top:20px;
}
.favItem{
  border:1px solid rgba(198,162,87,.22);border-radius:11px;padding:14px;
  margin-bottom:9px;background:rgba(27,48,44,.34);
}
.favTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.favName{font-family:var(--serif);font-size:17.5px;font-weight:700;margin:0;line-height:1.3;}
.favMeta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:7px 0 0;letter-spacing:.05em;}
.favAddr{font-family:var(--mono);font-size:10.5px;color:var(--dim);opacity:.78;margin:5px 0 0;line-height:1.6;}
.del{
  background:none;border:0;color:var(--dim);cursor:pointer;font-size:11px;
  padding:3px 6px;border-radius:6px;flex:none;font-family:var(--sans);
}
.del:hover{color:var(--vermilion);background:rgba(216,52,42,.1);}

/* ---------- footnote ---------- */
.note{margin-top:26px;border-top:1px solid rgba(198,162,87,.2);padding-top:14px;}
.note summary{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--brass);
  cursor:pointer;list-style:none;
}
.note summary::-webkit-details-marker{display:none;}
.note p{font-size:11.5px;line-height:1.9;color:var(--dim);margin:11px 0 0;}
button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px;
}
</style>

  }

  function bars(score){
    var s="";for(var i=1;i<=5;i++){s+='<span class="bar" data-on="'+(score>=i-0.25?"1":"0")+'"></span>';}
    return s;
  }
  function linksRow(r){
    return '<div class="links">'+
      '<a class="act" href="'+dianpingUrl(r)+'" target="_blank" rel="noopener noreferrer">大众点评</a>'+
      '<a class="act" href="'+xhsUrl(r)+'" target="_blank" rel="noopener noreferrer">小红书</a>'+
      '<a class="act" href="'+amapUrl(r)+'" target="_blank" rel="noopener noreferrer">高德导航</a>'+
    '</div>';
  }
  function renderResult(){
    var el=document.getElementById("result");
    if(!pick){el.innerHTML="";return;}
    var p=pick,fav=isFav(p);
    el.innerHTML=
      '<div class="card">'+
        '<div class="hero" style="background:linear-gradient(160deg,'+HUE[p.cuisine]+' 0%,#10201d 120%)">'+
          '<div class="heroTop"><span>NO.'+pad(p.id)+' / '+TOTAL+'</span>'+
            '<span class="heroKind">'+EMOJI[p.cuisine]+' '+esc(p.cuisine)+'</span></div>'+
          '<div class="heroSeal">'+esc(monogram(p.name))+'</div>'+
          '<h2 class="heroName">'+esc(p.name)+'</h2>'+
          '<span class="heroMall">📍 '+esc(p.mall)+'</span>'+
        '</div>'+
        '<div class="body">'+
          '<div class="tags"><span class="tag">'+EMOJI[p.cuisine]+' '+esc(p.cuisine)+'</span>'+
            '<span class="tag mall">'+esc(METRO[p.mall]||"")+'</span></div>'+
          '<p class="blurb">'+esc(p.blurb)+'</p>'+
          '<p class="addr">'+esc(p.addr)+'</p>'+
          '<div class="scoreRow"><span class="scoreNum">'+p.score.toFixed(1)+'</span>'+
            '<span class="bars">'+bars(p.score)+'</span>'+
            '<span class="scoreLbl">口碑指数<br>近一年综合</span></div>'+
          '<div class="acts">'+
            '<button class="act" data-fav="'+(fav?"1":"0")+'" data-act="fav">'+(fav?"已收藏 ✓":"收藏这家")+'</button>'+
            '<button class="act" data-act="reroll">换一家</button>'+
          '</div>'+
          linksRow(p)+
        '</div>'+
      '</div>';
  }

  function renderFav(){
    var el=document.getElementById("favView");
    if(favs.length===0){
      el.innerHTML='<div class="empty">还没有收藏。<br>摇到想去的店，点「收藏这家」，会一直留在这里。</div>';
      return;
    }
    el.innerHTML=favs.map(function(f){
      return '<div class="favItem"><div class="favTop"><div>'+
        '<h3 class="favName">'+esc(f.name)+'</h3>'+
        '<p class="favMeta">'+esc(f.cuisine)+' · '+esc(f.mall)+' · '+f.score.toFixed(1)+'</p>'+
        '</div><button class="del" data-act="del" data-val="'+f.id+'">移除</button></div>'+
        '<p class="favAddr">'+esc(f.addr)+'</p>'+linksRow(f)+'</div>';
    }).join("");
  }

  function updateNav(){
    document.getElementById("navFav").textContent="收藏夹"+(favs.length?" · "+favs.length:"");
    var btns=shell.querySelectorAll('.nav button');
    btns.forEach(function(b){b.setAttribute("data-on",b.getAttribute("data-val")===tab?"1":"0");});
    document.getElementById("rollView").style.display=tab==="roll"?"":"none";
    document.getElementById("favView").style.display=tab==="fav"?"":"none";
    if(tab==="fav")renderFav();
  }

  /* ---------- 交互 ---------- */
  function roll(){
    var pl=pool();
    if(rolling||pl.length===0)return;
    rolling=true;pick=null;renderResult();updatePool();
    var cand=pl.filter(function(d){return recent.indexOf(d.id)<0;});
    if(cand.length===0)cand=pl;
    var chosen=cand[Math.floor(Math.random()*cand.length)];
    recent=[chosen.id].concat(recent).slice(0,3);

    var face=1+Math.floor(Math.random()*6),fx=SHOW[face][0],fy=SHOW[face][1];
    rot={x:rot.x+720+(((fx-(rot.x%360))+360)%360),y:rot.y+900+(((fy-(rot.y%360))+360)%360)};
    var cube=document.getElementById("cube"),shadow=document.getElementById("shadow");
    cube.style.transform="rotateX("+rot.x+"deg) rotateY("+rot.y+"deg)";
    shadow.style.transform="scale(.55)";shadow.style.opacity="0.28";

    clearTimeout(timer);
    timer=setTimeout(function(){
      pick=chosen;rolling=false;
      shadow.style.transform="scale(1)";shadow.style.opacity="0.5";
      updatePool();renderResult();
      var c=document.querySelector(".card");
      if(c)c.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"});
    },DUR);
  }

  function toggleList(list,v){
    var i=list.indexOf(v);
    if(i>-1)list.splice(i,1);else list.push(v);
  }
  function afterFilter(){renderFbox();updatePool();}

  shell.addEventListener("click",function(e){
    var t=e.target.closest("[data-act]");
    if(!t)return;
    var a=t.getAttribute("data-act"),v=t.getAttribute("data-val");
    if(a==="tab"){tab=v;updateNav();}
    else if(a==="togglef"){openF=!openF;renderFbox();}
    else if(a==="mall-all"){malls=[];afterFilter();}
    else if(a==="cuis-all"){cuis=[];afterFilter();}
    else if(a==="mall"){toggleList(malls,v);afterFilter();}
    else if(a==="cuis"){toggleList(cuis,v);afterFilter();}
    else if(a==="reroll"){roll();}
    else if(a==="fav"){
      if(!pick)return;
      if(isFav(pick))favs=favs.filter(function(f){return f.id!==pick.id;});
      else favs=[pick].concat(favs);
      saveFavs();renderResult();updateNav();
    }
    else if(a==="del"){
      var id=parseInt(v,10);
      favs=favs.filter(function(f){return f.id!==id;});
      saveFavs();renderFav();updateNav();
    }
  });

  skeleton();
})();
</script>
</body>
</html>

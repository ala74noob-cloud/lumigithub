<body>
<style>
html,body{margin:0;background:#F4EFFB;}
:root{
  color-scheme:light;
  --bg:#F4EFFB;
  --surface:#FFFFFF;
  --cream:#FBF8FF;
  --taro:#A98CDC;
  --taro-2:#C3ADE8;
  --taro-deep:#6B4CA6;
  --ink:#4A3B66;
  --dim:#9A8BB8;
  --line:#E7DDF6;
  --pink:#F2B4D8;
  --pink-deep:#E579B4;
  --ditto:#B9A2E0;
  --ditto-edge:#9277C9;
  --round:"Yuanti SC","YuanTi SC","Hiragino Maru Gothic ProN","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --shadow:0 12px 30px rgba(120,88,178,.16);
}
*{box-sizing:border-box;}
.wrap{
  min-height:100vh;
  background:
    radial-gradient(120% 60% at 100% 0%, #F7E7F6 0%, transparent 55%),
    radial-gradient(120% 60% at 0% 5%, #E7DCFA 0%, transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:var(--round);-webkit-font-smoothing:antialiased;
  padding:22px 16px 60px;
}
.shell{max-width:520px;margin:0 auto;}

/* header */
.mast{display:flex;align-items:center;gap:12px;margin-bottom:2px;}
.logo{flex:none;filter:drop-shadow(0 6px 10px rgba(146,119,201,.35));}
h1{
  font-family:var(--round);font-weight:800;font-size:26px;line-height:1.14;
  margin:0;letter-spacing:.01em;color:var(--taro-deep);
}
.kicker{
  font-size:12px;letter-spacing:.14em;color:var(--taro);font-weight:700;margin:0 0 8px;
}
.sub{color:var(--dim);font-size:13px;line-height:1.7;margin:10px 0 0;}
.rule{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--taro),var(--pink) 62%,transparent);margin:14px 0 0;opacity:.75;}

/* nav */
.nav{display:flex;gap:8px;margin:16px 0 20px;}
.nav button{
  flex:1;padding:11px 8px;border-radius:14px;cursor:pointer;
  font-family:var(--round);font-size:14px;font-weight:700;letter-spacing:.02em;
  border:2px solid var(--line);background:var(--surface);color:var(--dim);transition:.18s;
}
.nav button[data-on="1"]{background:var(--taro);color:#fff;border-color:var(--taro);box-shadow:0 8px 18px rgba(169,140,220,.35);}
.nav button:hover{color:var(--taro-deep);}
.nav button[data-on="1"]:hover{color:#fff;}

/* filters */
.fbox{border:2px solid var(--line);border-radius:20px;padding:16px;background:var(--surface);box-shadow:var(--shadow);}
.fhead{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--round);font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--taro-deep);
}
.flabel{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin:16px 0 9px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  border:2px solid var(--line);background:var(--cream);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;
  font-family:var(--round);font-weight:600;transition:.15s;line-height:1.3;
}
.chip:hover{border-color:var(--taro-2);color:var(--taro-deep);}
.chip[data-on="1"]{background:var(--taro);color:#fff;border-color:var(--taro);}
.chip[data-all="1"][data-on="1"]{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff;}
.fcount{font-size:12.5px;color:var(--dim);margin-top:16px;font-weight:600;}
.fcount b{color:var(--taro-deep);font-weight:800;}

/* dice tray */
.tray{
  margin:22px 0 0;height:210px;border-radius:24px;position:relative;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#F1E9FC 0%,#E4D6F6 78%);
  border:2px solid var(--line);box-shadow:inset 0 6px 20px rgba(146,119,201,.18);
}
.stage{perspective:760px;width:104px;height:104px;z-index:2;}
.cube{
  width:104px;height:104px;position:relative;transform-style:preserve-3d;
  transition:transform 1250ms cubic-bezier(.16,.86,.28,1);
}
@media (prefers-reduced-motion:reduce){.cube{transition-duration:160ms;}}
.face{
  position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(150deg,#FFFFFF 0%,#FBF6FF 45%,#F0E6FB 100%);
  box-shadow:inset 0 0 0 2px rgba(146,119,201,.14), inset 0 -8px 16px rgba(146,119,201,.12);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;gap:3px;
}
.pip{width:15px;height:15px;border-radius:50%;align-self:center;justify-self:center;
  background:var(--taro);box-shadow:inset 0 2px 3px rgba(255,255,255,.4);}
.pip.red{background:var(--pink-deep);}
.pip.big{width:26px;height:26px;}
.shadow{
  position:absolute;bottom:34px;width:92px;height:14px;border-radius:50%;
  background:rgba(120,88,178,.28);filter:blur(9px);transition:.5s;z-index:1;
}
.trayTag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--taro);z-index:3;}
.trayDitto{position:absolute;bottom:10px;right:12px;z-index:1;opacity:.92;filter:drop-shadow(0 5px 8px rgba(146,119,201,.3));}

/* big button */
.roll{
  width:100%;margin-top:16px;padding:18px;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--taro) 0%,var(--pink-deep) 118%);color:#fff;
  font-family:var(--round);font-size:19px;letter-spacing:.18em;font-weight:800;
  box-shadow:0 12px 26px rgba(169,140,220,.42);transition:.16s;
}
.roll:hover{filter:brightness(1.05);transform:translateY(-1px);}
.roll:active{transform:translateY(2px);box-shadow:0 5px 12px rgba(169,140,220,.4);}
.roll:disabled{opacity:.55;cursor:wait;}

/* result card */
.card{
  margin-top:20px;border-radius:24px;overflow:hidden;
  border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
  animation:rise .46s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.card{animation:none;}}

/* hero (招牌) */
.hero{
  position:relative;overflow:hidden;padding:28px 22px 24px;
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
}
.hero::before{
  content:"";position:absolute;top:0;left:0;right:0;height:11px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.78) 0 16px,transparent 16px 32px);
  opacity:.85;pointer-events:none;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 90% at 50% -12%,rgba(255,255,255,.55),transparent 60%);
}
.heroTop{
  position:relative;z-index:1;width:100%;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--taro-deep);
}
.heroKind{display:inline-flex;align-items:center;gap:5px;}
.heroSeal{
  position:relative;z-index:1;width:66px;height:66px;border-radius:20px;flex:none;
  display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:32px;
  color:var(--taro-deep);line-height:1;background:rgba(255,255,255,.94);
  box-shadow:0 8px 18px rgba(120,88,178,.22);
}
.heroName{
  position:relative;z-index:1;margin:0;font-family:var(--round);font-weight:800;
  font-size:25px;line-height:1.28;letter-spacing:.01em;color:#3C2F58;
  text-shadow:0 1px 6px rgba(255,255,255,.5);max-width:100%;word-break:break-word;
}
.heroMall{position:relative;z-index:1;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--taro-deep);}
.body{padding:18px 18px 18px;}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0;}
.tag{
  font-size:12px;padding:5px 12px;border-radius:999px;font-weight:600;
  border:2px solid var(--line);color:var(--taro-deep);font-family:var(--round);background:var(--cream);
}
.tag.mall{border-color:rgba(242,180,216,.6);color:var(--pink-deep);background:#FDF3F9;}
.blurb{font-size:14.5px;line-height:1.85;color:var(--ink);margin:14px 0 0;}
.addr{
  font-size:12.5px;line-height:1.7;color:var(--dim);margin:12px 0 0;
  padding-left:19px;position:relative;word-break:break-all;font-weight:500;
}
.addr::before{content:"\1F4CD";position:absolute;left:0;top:0;font-size:12px;}
.scoreRow{display:flex;align-items:center;gap:11px;margin:16px 0 0;padding-top:15px;border-top:2px dashed var(--line);}
.scoreNum{font-size:25px;font-weight:800;color:var(--pink-deep);line-height:1;font-variant-numeric:tabular-nums;}
.bars{display:flex;gap:4px;}
.bar{width:16px;height:7px;border-radius:999px;background:var(--line);}
.bar[data-on="1"]{background:var(--taro);}
.scoreLbl{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--dim);margin-left:auto;text-align:right;line-height:1.5;}
.acts{display:flex;gap:9px;margin:16px 0 0;}
.act{
  flex:1;padding:13px 6px;border-radius:14px;cursor:pointer;font-size:13.5px;font-weight:700;
  font-family:var(--round);border:2px solid var(--line);background:var(--cream);color:var(--taro-deep);
  transition:.16s;text-align:center;text-decoration:none;display:block;
}
.act:hover{background:#F0E9FB;border-color:var(--taro-2);}
.act[data-fav="1"]{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff;}
.links{display:flex;gap:8px;margin:9px 0 0;}
.links .act{font-size:12.5px;padding:11px 6px;color:var(--taro);}
.links .act:hover{color:var(--taro-deep);}

/* empty / favorites */
.empty{
  border:2px dashed var(--taro-2);border-radius:20px;padding:30px 20px;text-align:center;
  color:var(--dim);font-size:14px;line-height:1.9;margin-top:20px;font-weight:600;background:var(--surface);
}
.favItem{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;background:var(--surface);box-shadow:var(--shadow);}
.favTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.favName{font-family:var(--round);font-size:18px;font-weight:800;margin:0;line-height:1.3;color:var(--taro-deep);}
.favMeta{font-size:12px;color:var(--dim);margin:7px 0 0;letter-spacing:.02em;font-weight:600;}
.favAddr{font-size:12px;color:var(--dim);opacity:.85;margin:6px 0 0;line-height:1.6;}
.del{background:none;border:0;color:var(--dim);cursor:pointer;font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:9px;flex:none;font-family:var(--round);}
.del:hover{color:var(--pink-deep);background:#FDF0F7;}

/* footnote */
.note{margin-top:28px;border-top:2px dashed var(--line);padding-top:16px;}
.note summary{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--taro);cursor:pointer;list-style:none;}
.note summary::-webkit-details-marker{display:none;}
.note p{font-size:12px;line-height:1.9;color:var(--dim);margin:11px 0 0;font-weight:500;}
.note b{color:var(--taro-deep);}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--taro);outline-offset:2px;}
</style>

      '<div class="nav">'+
        '<button data-act="tab" data-val="roll" data-on="1">摇骰子</button>'+
        '<button data-act="tab" data-val="fav" id="navFav">收藏夹</button>'+
      '</div>'+
      '<div id="rollView">'+
        '<div class="fbox" id="fbox"></div>'+
        '<div class="tray"><span class="trayTag">百变怪帮你选 ✨</span>'+
          '<div class="stage"><div class="cube" id="cube"></div><div class="shadow" id="shadow"></div></div>'+
        ditto(58,"trayDitto")+
        '</div>'+
        '<button class="roll" id="rollBtn">摇一摇 🎲</button>'+
        '<div id="poolEmpty"></div>'+
        '<div id="result"></div>'+
      '</div>'+
      '<div id="favView" style="display:none"></div>'+
      '';

    var cube=document.getElementById("cube");
    buildFaces(cube);
    cube.style.transform="rotateX("+rot.x+"deg) rotateY("+rot.y+"deg)";
    document.getElementById("rollBtn").addEventListener("click",roll);
    renderFbox();updatePool();renderResult();updateNav();
  }

  function chip(label,on,act,val,all){
    return '<button class="chip"'+(all?' data-all="1"':'')+' data-on="'+(on?"1":"0")+'"'+
           ' data-act="'+act+'"'+(val!=null?' data-val="'+esc(val)+'"':'')+'>'+esc(label)+'</button>';
  }
  function renderFbox(){
    var html='<button class="fhead" data-act="togglef"><span>筛选条件</span><span>'+(openF?"收起 ─":"展开 ＋")+'</span></button>';
    if(openF){
      html+='<p class="flabel">商场</p><div class="chips">';
      html+=chip("不限",malls.length===0,"mall-all",null,true);
      MALLS.forEach(function(m){html+=chip(m.k,malls.indexOf(m.k)>-1,"mall",m.k,false);});
      html+='</div><p class="flabel">口味</p><div class="chips">';
      html+=chip("不限",cuis.length===0,"cuis-all",null,true);
      CUISINES.forEach(function(c){html+=chip(c.k,cuis.indexOf(c.k)>-1,"cuis",c.k,false);});
      html+='</div>';
    }
    var n=pool().length;
    html+='<p class="fcount">当前候选 <b>'+n+'</b> / '+TOTAL+' 家</p>';
    document.getElementById("fbox").innerHTML=html;
  }

  function updatePool(){
    var n=pool().length;
    var btn=document.getElementById("rollBtn");
    btn.disabled=rolling||n===0;
    btn.textContent=rolling?"变身中…":(pick?"再摇一次":"摇一摇 🎲");
    document.getElementById("poolEmpty").innerHTML=
      n===0?'<div class="empty">这个组合暂时没有店。<br>八个商场里，东南亚菜和韩餐本来就少，换个商场或者把口味放宽试试。</div>':"";
  }

  function bars(score){
    var s="";for(var i=1;i<=5;i++){s+='<span class="bar" data-on="'+(score>=i-0.25?"1":"0")+'"></span>';}
    return s;
  }
  function linksRow(r){
    return '<div class="links">'+
      '<a class="act" href="'+dianpingUrl(r)+'" target="_blank" rel="noopener noreferrer">大众点评</a>'+
      '<a class="act" href="'+xhsUrl(r)+'" target="_blank" rel="noopener noreferrer">小红书</a>'+
      '<a class="act" href="'+amapUrl(r)+'" target="_blank" rel="noopener noreferrer">高德导航</a>'+
    '</div>';
  }
  function renderResult(){
    var el=document.getElementById("result");
    if(!pick){el.innerHTML="";return;}
    var p=pick,fav=isFav(p);
    el.innerHTML=
      '<div class="card">'+
        '<div class="hero" style="background:linear-gradient(160deg,'+HUE[p.cuisine]+' 0%,#F5EEFC 125%)">'+
          '<div class="heroTop"><span>NO.'+pad(p.id)+' / '+TOTAL+'</span>'+
            '<span class="heroKind">'+EMOJI[p.cuisine]+' '+esc(p.cuisine)+'</span></div>'+
          '<div class="heroSeal">'+esc(monogram(p.name))+'</div>'+
          '<h2 class="heroName">'+esc(p.name)+'</h2>'+
          '<span class="heroMall">📍 '+esc(p.mall)+'</span>'+
        '</div>'+
        '<div class="body">'+
          '<div class="tags"><span class="tag">'+EMOJI[p.cuisine]+' '+esc(p.cuisine)+'</span>'+
            '<span class="tag mall">'+esc(METRO[p.mall]||"")+'</span></div>'+
          '<p class="blurb">'+esc(p.blurb)+'</p>'+
          '<p class="addr">'+esc(p.addr)+'</p>'+
          '<div class="scoreRow"><span class="scoreNum">'+p.score.toFixed(1)+'</span>'+
            '<span class="bars">'+bars(p.score)+'</span>'+
            '<span class="scoreLbl">口碑指数<br>近一年综合</span></div>'+
          '<div class="acts">'+
            '<button class="act" data-fav="'+(fav?"1":"0")+'" data-act="fav">'+(fav?"已收藏 ✓":"收藏这家")+'</button>'+
            '<button class="act" data-act="reroll">换一家</button>'+
          '</div>'+
          linksRow(p)+
        '</div>'+
      '</div>';
  }

  function renderFav(){
    var el=document.getElementById("favView");
    if(favs.length===0){
      el.innerHTML='<div class="empty">还没有收藏。<br>摇到想去的店，点「收藏这家」，会一直留在这里。</div>';
      return;
    }
    el.innerHTML=favs.map(function(f){
      return '<div class="favItem"><div class="favTop"><div>'+
        '<h3 class="favName">'+esc(f.name)+'</h3>'+
        '<p class="favMeta">'+esc(f.cuisine)+' · '+esc(f.mall)+' · '+f.score.toFixed(1)+'</p>'+
        '</div><button class="del" data-act="del" data-val="'+f.id+'">移除</button></div>'+
        '<p class="favAddr">'+esc(f.addr)+'</p>'+linksRow(f)+'</div>';
    }).join("");
  }

  function updateNav(){
    document.getElementById("navFav").textContent="收藏夹"+(favs.length?" · "+favs.length:"");
    var btns=shell.querySelectorAll('.nav button');
    btns.forEach(function(b){b.setAttribute("data-on",b.getAttribute("data-val")===tab?"1":"0");});
    document.getElementById("rollView").style.display=tab==="roll"?"":"none";
    document.getElementById("favView").style.display=tab==="fav"?"":"none";
    if(tab==="fav")renderFav();
  }

  /* ---------- 交互 ---------- */
  function roll(){
    var pl=pool();
    if(rolling||pl.length===0)return;
    rolling=true;pick=null;renderResult();updatePool();
    var cand=pl.filter(function(d){return recent.indexOf(d.id)<0;});
    if(cand.length===0)cand=pl;
    var chosen=cand[Math.floor(Math.random()*cand.length)];
    recent=[chosen.id].concat(recent).slice(0,3);

    var face=1+Math.floor(Math.random()*6),fx=SHOW[face][0],fy=SHOW[face][1];
    rot={x:rot.x+720+(((fx-(rot.x%360))+360)%360),y:rot.y+900+(((fy-(rot.y%360))+360)%360)};
    var cube=document.getElementById("cube"),shadow=document.getElementById("shadow");
    cube.style.transform="rotateX("+rot.x+"deg) rotateY("+rot.y+"deg)";
    shadow.style.transform="scale(.55)";shadow.style.opacity="0.28";

    clearTimeout(timer);
    timer=setTimeout(function(){
      pick=chosen;rolling=false;
      shadow.style.transform="scale(1)";shadow.style.opacity="0.5";
      updatePool();renderResult();
      var c=document.querySelector(".card");
      if(c)c.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"});
    },DUR);
  }

  function toggleList(list,v){
    var i=list.indexOf(v);
    if(i>-1)list.splice(i,1);else list.push(v);
  }
  function afterFilter(){renderFbox();updatePool();}

  shell.addEventListener("click",function(e){
    var t=e.target.closest("[data-act]");
    if(!t)return;
    var a=t.getAttribute("data-act"),v=t.getAttribute("data-val");
    if(a==="tab"){tab=v;updateNav();}
    else if(a==="togglef"){openF=!openF;renderFbox();}
    else if(a==="mall-all"){malls=[];afterFilter();}
    else if(a==="cuis-all"){cuis=[];afterFilter();}
    else if(a==="mall"){toggleList(malls,v);afterFilter();}
    else if(a==="cuis"){toggleList(cuis,v);afterFilter();}
    else if(a==="reroll"){roll();}
    else if(a==="fav"){
      if(!pick)return;
      if(isFav(pick))favs=favs.filter(function(f){return f.id!==pick.id;});
      else favs=[pick].concat(favs);
      saveFavs();renderResult();updateNav();
    }
    else if(a==="del"){
      var id=parseInt(v,10);
      favs=favs.filter(function(f){return f.id!==id;});
      saveFavs();renderFav();updateNav();
    }
  });

  skeleton();
})();
</script>
</body>
</html>

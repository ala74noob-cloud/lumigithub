<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>白胶唱片</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  color-scheme:dark;
  --blue:#126698;
  --bg-1:#1a2a38;
  --bg-2:#0b1118;
  --ink:#e9eef2;
  --dim:rgba(233,238,242,.55);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-2);}
body{
  background:radial-gradient(120% 90% at 50% 30%, var(--bg-1) 0%, var(--bg-2) 70%);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;}
canvas#gl.pointer{cursor:pointer;}
canvas#gl.dragging{cursor:grabbing;}
/* film grain over everything, matching the photos */
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite;}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
.hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));text-align:center;
  font-size:13px;letter-spacing:.18em;color:var(--dim);pointer-events:none;transition:opacity .4s;padding:0 16px;}
.bar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);}
.bar button{
  appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(18,102,152,.22);
  color:var(--ink);font:inherit;font-size:13px;letter-spacing:.08em;padding:9px 16px;border-radius:999px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;transition:background .2s,opacity .3s;}
.bar button:hover{background:rgba(18,102,152,.45);}
.bar button[hidden]{display:none;}
.bar button:disabled{opacity:.35;cursor:default;}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;letter-spacing:.2em;transition:opacity .6s;pointer-events:none;}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="grain"></div>
<div class="loading" id="loading">LOADING</div>
<div class="hint" id="hint">点击封套 · 打开</div>
<div class="bar">
  <button id="btnPop" hidden>取出唱片</button>
  <button id="btnSpin" hidden>暂停转动</button>
  <button id="btnBack" hidden>放回唱片</button>
  <button id="btnClose" hidden>合上封套</button>
  <button id="btnView">复位视角</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const IMG = {
  cover:  '__COVER__',
  label:  '__LABEL__',
  spread: '__SPREAD__',
};
const BLUE = '#126698';          // sampled from the sky in the cover photo

/* ---------- dimensions (1 unit ≈ 10 cm) ---------- */
const S = 3.1;        // sleeve square side (12")
const T = 0.014;      // board thickness
const G = 0.03;       // pocket gap inside the right panel
const R = 1.48;       // record radius
const H = 0.018;      // record thickness
const HOLE = 0.036;
const LABEL_R = 0.5;

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
{
  // backdrop lives in the scene (not CSS) so the clear plastic can refract it
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const gr = g.createRadialGradient(256, 150, 0, 256, 220, 420);
  gr.addColorStop(0, css.getPropertyValue('--bg-1').trim()); gr.addColorStop(0.7, css.getPropertyValue('--bg-2').trim());
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  scene.background = new THREE.CanvasTexture(c);
  scene.background.colorSpace = THREE.SRGBColorSpace;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
camera.position.set(2.2, 1.4, 8.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 18;

scene.add(new THREE.HemisphereLight(0xdfeeff, 0x1a2430, 0.5));
const key = new THREE.DirectionalLight(0xfff4e6, 1.6);
key.position.set(4, 6, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6;   key.shadow.camera.bottom = -6;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fc4ff, 0.7);
rim.position.set(-6, 2, -5);
scene.add(rim);

// soft shadow catcher behind the objects
const catcher = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
catcher.position.z = -1.2;
catcher.receiveShadow = true;
scene.add(catcher);

const root = new THREE.Group();   // gentle idle float
scene.add(root);

/* ---------- textures ---------- */
const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadTex(src) {
  return new Promise((res, rej) => loader.load(src, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    res(t);
  }, undefined, rej));
}
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function canvasTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function addGrain(ctx, w, h, amt) {
  const d = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < d.data.length; i += 4) {
    const n = (Math.random() - 0.5) * amt;
    d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
  }
  ctx.putImageData(d, 0, 0);
}

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// height field (0..1 floats) → tangent-space normal map
function heightToNormal(h, size, k, wrap) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), out = g.createImageData(size, size);
  const at = (x, y) => wrap
    ? h[((y + size) % size) * size + ((x + size) % size)]
    : h[Math.min(size - 1, Math.max(0, y)) * size + Math.min(size - 1, Math.max(0, x))];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * k, dy = (at(x, y + 1) - at(x, y - 1)) * k;
    const l = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
    out.data[i] = (-dx / l * .5 + .5) * 255;
    out.data[i + 1] = (dy / l * .5 + .5) * 255;
    out.data[i + 2] = (1 / l * .5 + .5) * 255;
    out.data[i + 3] = 255;
  }
  g.putImageData(out, 0, 0);
  return c;
}
function readHeight(g, size, jitter) {
  const d = g.getImageData(0, 0, size, size).data, h = new Float32Array(size * size);
  for (let i = 0; i < h.length; i++) h[i] = d[i * 4] / 255 + (Math.random() - .5) * jitter;
  return h;
}

// tiling uncoated card stock: cloudy formation + short fibres + tooth
function makePaperMaps(size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, size, size);
  const tiles = [-size, 0, size];
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 10 + Math.random() * 46;
    const v = Math.random() < .5 ? 0 : 255;
    for (const ox of tiles) for (const oy of tiles) {
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},.07)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
      g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, 2 * r, 2 * r);
    }
  }
  g.lineCap = 'round';
  for (let i = 0; i < 3200; i++) {
    const x = Math.random() * size, y = Math.random() * size, len = 3 + Math.random() * 16, a = Math.random() * Math.PI * 2;
    const v = Math.random() < .55 ? 255 : 0, bend = (Math.random() - .5) * 6;
    g.strokeStyle = `rgba(${v},${v},${v},${.07 + Math.random() * .12})`;
    g.lineWidth = .5 + Math.random() * .9;
    for (const ox of tiles) for (const oy of tiles) {
      const X = x + ox, Y = y + oy;
      if (X < -20 || X > size + 20 || Y < -20 || Y > size + 20) continue;
      g.beginPath(); g.moveTo(X, Y);
      g.quadraticCurveTo(X + Math.cos(a) * len / 2 - Math.sin(a) * bend, Y + Math.sin(a) * len / 2 + Math.cos(a) * bend,
                         X + Math.cos(a) * len, Y + Math.sin(a) * len);
      g.stroke();
    }
  }
  const h = readHeight(g, size, .08);
  const rc = document.createElement('canvas'); rc.width = rc.height = size;
  const rg = rc.getContext('2d'), rd = rg.createImageData(size, size);
  for (let i = 0; i < h.length; i++) {
    const v = 225 + (h[i] - .5) * 90;
    rd.data[i * 4] = rd.data[i * 4 + 1] = rd.data[i * 4 + 2] = v; rd.data[i * 4 + 3] = 255;
  }
  rg.putImageData(rd, 0, 0);
  const normal = canvasTex(heightToNormal(h, size, 2.2, true), false);
  const rough = canvasTex(rc, false);
  for (const t of [normal, rough]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); }
  return { normal, rough };
}

// print a board face: artwork or flat ink, then handling wear (scuffed edges,
// whitened corners) and optional ring wear where the record presses through
function printFace({ img, sx = 0, sy = 0, sw, sh, color, ring = 0, size = 1024 }) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  if (img) g.drawImage(img, sx, sy, sw ?? img.width, sh ?? img.height, 0, 0, size, size);
  else {
    g.fillStyle = color; g.fillRect(0, 0, size, size);
    const v = g.createRadialGradient(size / 2, size * .4, size * .08, size / 2, size / 2, size * .8);
    v.addColorStop(0, 'rgba(255,255,255,.05)'); v.addColorStop(1, 'rgba(0,0,0,.16)');
    g.fillStyle = v; g.fillRect(0, 0, size, size);
    addGrain(g, size, size, 18);
  }
  g.globalCompositeOperation = 'screen';
  if (ring) {
    const rr = (R / S) * size * 0.99, m = size / 2;
    g.lineCap = 'round';
    for (let i = 0; i < 260; i++) {
      const a0 = Math.random() * Math.PI * 2, a1 = a0 + .04 + Math.random() * .35;
      g.strokeStyle = `rgba(255,255,255,${ring * (.3 + Math.random() * .7)})`;
      g.lineWidth = 2 + Math.random() * 12;
      g.beginPath(); g.arc(m, m, rr + (Math.random() - .5) * 10, a0, a1); g.stroke();
    }
  }
  for (let side = 0; side < 4; side++) for (let i = 0; i < 260; i++) {
    const t = Math.random() * size, w = .8 + Math.random() * (Math.random() < .08 ? 5 : 2), l = 2 + Math.random() * 18;
    g.fillStyle = `rgba(255,255,255,${.08 + Math.random() * .3})`;
    if (side === 0) g.fillRect(t, 0, l, w);
    else if (side === 1) g.fillRect(t, size - w, l, w);
    else if (side === 2) g.fillRect(0, t, w, l);
    else g.fillRect(size - w, t, w, l);
  }
  for (const [x, y] of [[0, 0], [size, 0], [0, size], [size, size]]) {
    const cr = 18 + Math.random() * 22;
    const gr = g.createRadialGradient(x, y, 0, x, y, cr);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(x - cr, y - cr, 2 * cr, 2 * cr);
  }
  g.globalCompositeOperation = 'source-over';
  return canvasTex(c);
}

// polythene outer sleeve: long stretch streaks and a few soft creases
function makeCrinkleNormal(size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, size, size);
  g.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const a = Math.PI / 2 + (Math.random() - .5) * .9, len = 60 + Math.random() * 260;
    const v = Math.random() < .5 ? 0 : 255;
    for (let w = 7; w >= 1; w -= 2) {
      g.strokeStyle = `rgba(${v},${v},${v},${.035 + Math.random() * .03})`; g.lineWidth = w;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a) * len / 2 + (Math.random() - .5) * 30, y + Math.sin(a) * len / 2,
                         x + Math.cos(a) * len, y + Math.sin(a) * len);
      g.stroke();
    }
  }
  return canvasTex(heightToNormal(readHeight(g, size, .01), size, 3.0, false), false);
}

/* record face: colour map, plus roughness / clearcoat maps so the
   label reads as matte paper and the grooves as glossy vinyl */
const DISC_PX = 2048;
function drawGrooves(g, size, base, lineDark, lineLight) {
  const c = size / 2, px = c / R;
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  const inner = (LABEL_R + 0.06) * px, outer = (R - 0.04) * px;
  // track gaps (smooth bands between songs)
  const gaps = [0.18, 0.37, 0.55, 0.74].map(f => inner + (outer - inner) * f);
  for (let r = inner; r < outer; r += 1.35) {
    const inGap = gaps.some(gp => Math.abs(r - gp) < 6);
    g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2);
    const j = Math.random();
    g.strokeStyle = inGap ? lineLight : (j < 0.5 ? lineDark : lineLight);
    g.lineWidth = inGap ? 1.2 : 0.7;
    g.stroke();
  }
  // lead-in / run-out edges
  g.lineWidth = 2; g.strokeStyle = lineDark;
  [inner, outer, (R - 0.01) * px].forEach(r => { g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2); g.stroke(); });
}
function makeDiscFace(labelImg) {
  const c = document.createElement('canvas'); c.width = c.height = DISC_PX;
  const g = c.getContext('2d'), m = DISC_PX / 2, px = m / R;
  drawGrooves(g, DISC_PX, '#f2f1ee', 'rgba(120,125,130,.16)', 'rgba(255,255,255,.55)');
  // label
  g.save();
  g.beginPath(); g.arc(m, m, LABEL_R * px, 0, Math.PI * 2); g.clip();
  if (labelImg) {
    g.drawImage(labelImg, m - LABEL_R * px, m - LABEL_R * px, LABEL_R * 2 * px, LABEL_R * 2 * px);
  } else {
    g.fillStyle = BLUE; g.fillRect(0, 0, DISC_PX, DISC_PX);
    const v = g.createRadialGradient(m, m, 0, m, m, LABEL_R * px);
    v.addColorStop(0, 'rgba(255,255,255,.08)'); v.addColorStop(1, 'rgba(0,0,0,.15)');
    g.fillStyle = v; g.fillRect(0, 0, DISC_PX, DISC_PX);
    addGrain(g, DISC_PX, DISC_PX, 14);
  }
  g.restore();
  // pressed ring around the label
  g.beginPath(); g.arc(m, m, LABEL_R * px + 2, 0, Math.PI * 2);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 3; g.stroke();
  return canvasTex(c);
}
function makeDiscMasks() {
  const sz = 1024, m = sz / 2, px = m / R;
  // roughness (green channel): grooves low, label high
  const rc = document.createElement('canvas'); rc.width = rc.height = sz;
  const rg = rc.getContext('2d');
  drawGrooves(rg, sz, 'rgb(70,70,70)', 'rgb(120,120,120)', 'rgb(40,40,40)');
  rg.fillStyle = 'rgb(235,235,235)';
  rg.beginPath(); rg.arc(m, m, LABEL_R * px, 0, Math.PI * 2); rg.fill();
  // clearcoat (red channel): only the vinyl
  const cc = document.createElement('canvas'); cc.width = cc.height = sz;
  const cg = cc.getContext('2d');
  cg.fillStyle = '#fff'; cg.fillRect(0, 0, sz, sz);
  cg.fillStyle = '#000'; cg.beginPath(); cg.arc(m, m, LABEL_R * px, 0, Math.PI * 2); cg.fill();
  return { rough: canvasTex(rc, false), coat: canvasTex(cc, false) };
}

/* ---------- build ---------- */
const sleeve = new THREE.Group();      // shifts right when opened so the spread is centred
root.add(sleeve);
let leftHinge, record, recordSpin, pickRecord;
const pickSleeve = [];

/* board shape: every board shares the same faint dish, and the faces nearest the
   record pillow outwards over it, so the jacket reads as card with something inside */
const WARP = 0.006;
const pillow = (x, y) => 1 - smooth(R - 0.32, R + 0.06, Math.hypot(x, y));
const curl = (x, y) => WARP * ((x / S) ** 2 + 0.6 * (y / S) ** 2);
const FRONT_BULGE = 0.004, INNER_BULGE = 0.002, BACK_BULGE = 0.007;
function boardGeo(d, { front = 0, back = 0 } = {}) {
  const geo = new THREE.BoxGeometry(S, S, d, 48, 48, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setZ(i, z + curl(x, y) + (z > 0 ? front : -back) * pillow(x, y));
  }
  geo.computeVertexNormals();
  return geo;
}

let spine, plastic;
const plasticMats = [];
async function build() {
  const [coverImg, spreadImg, labelImg] = await Promise.all([
    loadImg(IMG.cover), loadImg(IMG.spread), loadImg(IMG.label),
  ]);
  const half = spreadImg.width / 2;
  const coverTex = printFace({ img: coverImg, ring: 0.012 });
  const spreadL = printFace({ img: spreadImg, sx: 0, sw: half, sh: spreadImg.height });
  const spreadR = printFace({ img: spreadImg, sx: half, sw: half, sh: spreadImg.height });
  const backTex = printFace({ color: BLUE, ring: 0.035 });

  const pm = makePaperMaps();
  const card = (opts) => new THREE.MeshPhysicalMaterial({
    roughness: 1, roughnessMap: pm.rough, normalMap: pm.normal, normalScale: new THREE.Vector2(0.6, 0.6),
    sheen: 0.12, sheenRoughness: 0.9, sheenColor: new THREE.Color('#ffffff'), metalness: 0, ...opts,
  });
  const edge  = card({ color: '#ebe5d8', normalScale: new THREE.Vector2(1.2, 1.2) });  // raw board core
  const edgeB = card({ color: BLUE });
  const printed = map => card({ map });
  const mesh = (geo, mats) => { const m = new THREE.Mesh(geo, mats); m.castShadow = true; m.receiveShadow = true; return m; };

  // right panel: inner board (spread right half) + back board (blue) with the record pocket between
  const right = new THREE.Group();
  sleeve.add(right);
  const inner = mesh(boardGeo(T, { front: INNER_BULGE }), [edge, edge, edge, edge, printed(spreadR), edge]);
  inner.position.z = -T / 2;
  const back = mesh(boardGeo(T, { back: BACK_BULGE }), [edgeB, edgeB, edgeB, edgeB, edgeB, printed(backTex)]);
  back.position.z = -T - G - T / 2;
  right.add(inner, back);
  // pocket walls: outer edge and bottom (top stays open for the record)
  const wallD = G + 0.001, wz = -T - G / 2;
  const wR = mesh(new THREE.BoxGeometry(0.01, S, wallD), edgeB); wR.position.set(S / 2 - 0.005, 0, wz);
  const wB = mesh(new THREE.BoxGeometry(S, 0.01, wallD), edgeB); wB.position.set(0, -S / 2 + 0.005, wz);
  right.add(wR, wB);

  // rounded spine: a folded card hinge wrapping the whole stack
  const SPINE_R = (3 * T + G) / 2 + 0.002;
  spine = mesh(new THREE.CylinderGeometry(SPINE_R, SPINE_R, S, 28, 1, true, Math.PI, Math.PI), edgeB);
  spine.position.set(-S / 2, 0, (T - 2 * T - G) / 2);
  spine.userData.z0 = spine.position.z;
  sleeve.add(spine);

  // left panel (front cover) hinged at the spine
  leftHinge = new THREE.Group();
  leftHinge.position.set(-S / 2, 0, 0);
  sleeve.add(leftHinge);
  const front = mesh(boardGeo(T, { front: FRONT_BULGE }), [edge, edge, edge, edge, printed(coverTex), printed(spreadL)]);
  front.position.set(S / 2, 0, T / 2 + 0.0005);
  leftHinge.add(front);

  pickSleeve.push(inner, back, front, spine, wR, wB);
  buildPlastic();

  // record
  record = new THREE.Group();
  recordSpin = new THREE.Group();
  record.add(recordSpin);
  root.add(record);
  const masks = makeDiscMasks();
  const vinyl = map => new THREE.MeshPhysicalMaterial({
    map, color: 0xffffff, roughness: 1, roughnessMap: masks.rough,
    clearcoat: 1, clearcoatMap: masks.coat, clearcoatRoughness: 0.12,
    sheen: 0.4, sheenColor: new THREE.Color('#dfe9f2'), sheenRoughness: 0.5,
  });
  const faceGeo = new THREE.RingGeometry(HOLE, R, 256, 1);
  const faceA = new THREE.Mesh(faceGeo, vinyl(makeDiscFace(labelImg)));
  faceA.position.z = H / 2;
  const faceB = new THREE.Mesh(faceGeo, vinyl(makeDiscFace(null)));
  faceB.rotation.y = Math.PI; faceB.position.z = -H / 2;
  const rimMat = new THREE.MeshPhysicalMaterial({ color: '#f4f3f0', roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.2 });
  const rimMesh = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 256, 1, true), rimMat);
  rimMesh.rotation.x = Math.PI / 2;
  const holeMesh = new THREE.Mesh(new THREE.CylinderGeometry(HOLE, HOLE, H, 32, 1, true),
    new THREE.MeshStandardMaterial({ color: '#cfcac2', side: THREE.BackSide }));
  holeMesh.rotation.x = Math.PI / 2;
  [faceA, faceB, rimMesh].forEach(m => { m.castShadow = true; m.receiveShadow = true; });
  // invisible solid disc so grabbing the centre hole still counts as grabbing the record
  pickRecord = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 64), new THREE.MeshBasicMaterial({ visible: false }));
  pickRecord.rotation.x = Math.PI / 2;
  recordSpin.add(faceA, faceB, rimMesh, holeMesh, pickRecord);
  recordSpin.rotation.z = Math.random() * Math.PI * 2;
  record.visible = false;
  placeRecordInPocket();

  frameFor('closed', true);
}

/* clear polythene outer sleeve: a little wider and taller than the jacket,
   open at the top with a loose flared lip, creased and stretched */
function buildPlastic() {
  plastic = new THREE.Group();
  sleeve.add(plastic);
  const PW = S / 2 + 0.035, PB = -S / 2 - 0.03, PT = S / 2 + 0.17;
  const zF = T + 0.0005 + 0.006, zB = -2 * T - G - 0.006;
  const clampX = x => Math.max(-S / 2, Math.min(S / 2, x)), clampY = y => Math.max(-S / 2, Math.min(S / 2, y));
  const base = (x, y) => curl(clampX(x), clampY(y));
  // fixed creases so the sleeve looks the same every visit
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const creases = Array.from({ length: 9 }, () => {
    const a = Math.PI / 2 + (rnd() - .5) * 1.4;
    return { nx: Math.cos(a), ny: Math.sin(a), c: (rnd() - .5) * S, amp: .002 + rnd() * .005, w: .03 + rnd() * .12 };
  });
  const wrinkle = (x, y) => {
    let v = 0;
    for (const k of creases) { const d = x * k.ny - y * k.nx - k.c; v += k.amp * Math.exp(-((d / k.w) ** 2)); }
    v += .0015 * (1 + Math.sin(x * 3.1 + y * 1.7)) * (1 + Math.sin(y * 2.3 - x * .9));
    return v * smooth(0, .15, PW - Math.abs(x)) * smooth(0, .15, y - PB);
  };
  const lip = y => .03 * smooth(S / 2 - .02, PT, y) ** 2;

  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.035,
    transmission: 1, thickness: 0.004, ior: 1.5,
    normalMap: makeCrinkleNormal(), normalScale: new THREE.Vector2(0.6, 0.6),
    specularIntensity: 0.8,
    transparent: true, opacity: 1, side: THREE.DoubleSide, depthWrite: false,
    envMapIntensity: 0.9,
  });
  plasticMats.push(mat);

  const sheet = (sign) => {
    const geo = new THREE.PlaneGeometry(2 * PW, PT - PB, 96, 96);
    geo.translate(0, (PT + PB) / 2, 0);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      const bulge = sign > 0 ? FRONT_BULGE * pillow(x, y) : -BACK_BULGE * pillow(x, y);
      p.setZ(i, (sign > 0 ? zF : zB) + base(x, y) + bulge + sign * (wrinkle(x, y) + lip(y)));
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  };
  // side and bottom folds: half tubes joining front and back sheets
  const rad = (zF - zB) / 2, zc = (zF + zB) / 2;
  const tube = (len, thetaStart) => new THREE.CylinderGeometry(rad, rad, len, 16, 48, true, thetaStart, Math.PI);
  const bend = (geo, f) => { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) f(p, i); geo.computeVertexNormals(); return geo; };
  const sideGeo = (sx) => bend(tube(PT - PB - 0.002, sx > 0 ? 0 : Math.PI), (p, i) => {
    const y = p.getY(i) + (PT + PB) / 2;
    p.setY(i, y); p.setX(i, p.getX(i) + sx * PW); p.setZ(i, p.getZ(i) + zc + base(sx * PW, y));
  });
  const botGeo = bend(tube(2 * PW, Math.PI), (p, i) => {
    // cylinder axis is y; lay it along x with the rounded half facing down
    const ax = p.getY(i), ox = p.getX(i), oz = p.getZ(i);
    p.setXYZ(i, ax, PB + ox, oz + zc + base(ax, PB));
  });
  plastic.add(sheet(1), sheet(-1), new THREE.Mesh(sideGeo(1), mat), new THREE.Mesh(sideGeo(-1), mat), new THREE.Mesh(botGeo, mat));
  plastic.traverse(o => { if (o.isMesh) { o.renderOrder = 2; pickSleeve.push(o); } });
}
function setPlastic(k) {   // 0 = on the jacket, 1 = slid off and gone
  plastic.position.y = -k * (S * 2.2);
  plasticMats.forEach(m => { m.opacity = 1 - smooth(.35, 1, k); });
  plastic.visible = k < 1;
}

/* ---------- state ---------- */
let state = 'closed';   // closed | open | popped
let busy = false;
let spinning = true;
let spinVel = 0.55;      // rad/s, slow showroom spin
const ui = {
  hint: document.getElementById('hint'),
  pop: document.getElementById('btnPop'),
  spin: document.getElementById('btnSpin'),
  back: document.getElementById('btnBack'),
  close: document.getElementById('btnClose'),
  view: document.getElementById('btnView'),
};
function refreshUI() {
  ui.pop.hidden = state !== 'open';
  ui.back.hidden = state !== 'popped';
  ui.spin.hidden = state !== 'popped';
  ui.close.hidden = state === 'closed';
  ui.spin.textContent = spinning ? '暂停转动' : '继续转动';
  [ui.pop, ui.back, ui.close, ui.spin].forEach(b => b.disabled = busy);
  ui.hint.textContent = {
    closed: '点击封套 · 拆开外袋并打开',
    open: '点击封套 · 取出唱片',
    popped: '拖动唱片 · 360° 旋转检视　拖动空白处 · 环绕视角',
  }[state];
  ui.hint.style.opacity = busy ? 0 : 1;
}

/* ---------- tweening ---------- */
const tweens = new Set();
const ease = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function tween(dur, fn, e = ease.inOut) {
  return new Promise(res => tweens.add({ t0: performance.now(), dur: dur * 1000, fn, e, res }));
}
function stepTweens(now) {
  for (const tw of tweens) {
    const k = Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(tw.e(k));
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
}
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- camera framing ---------- */
const POP_POS = new THREE.Vector3(0, 0.15, 1.5);
function fitDistance(w, h) {
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const dh = (h / 2) / Math.tan(vf / 2);
  const dw = (w / 2) / (Math.tan(vf / 2) * camera.aspect);
  return Math.max(dh, dw) * 1.18;
}
function frameFor(which, instant = false) {
  let target, dist, dir;
  if (which === 'closed') { target = new THREE.Vector3(0, 0, 0); dist = fitDistance(S, S) * 1.25; dir = new THREE.Vector3(0.28, 0.16, 1); }
  else if (which === 'open') { target = new THREE.Vector3(0, 0, 0); dist = fitDistance(2 * S, S); dir = new THREE.Vector3(0.12, 0.1, 1); }
  else { target = POP_POS.clone(); dist = fitDistance(2 * R, 2 * R) * 1.25; dir = new THREE.Vector3(0.18, 0.12, 1); }
  const to = target.clone().add(dir.normalize().multiplyScalar(dist));
  if (instant) { controls.target.copy(target); camera.position.copy(to); controls.update(); return Promise.resolve(); }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  return tween(1.3, k => { camera.position.lerpVectors(p0, to, k); controls.target.lerpVectors(t0, target, k); });
}

/* ---------- record placement helpers ---------- */
function pocketPos() { return new THREE.Vector3(sleeve.position.x, 0, -T - G / 2); }
function placeRecordInPocket() {
  record.position.copy(pocketPos());
  record.quaternion.identity();
}

/* ---------- actions ---------- */
// as the gatefold lies flat the folded spine flattens and tucks behind the gutter
function setSpine(k) {
  spine.position.z = lerp(spine.userData.z0, -T - G / 2, k);
  spine.scale.set(lerp(1, 0.4, k), 1, lerp(1, 0.6, k));
}
async function openSleeve() {
  busy = true; refreshUI();
  const x0 = sleeve.position.x;
  await tween(1.0, k => setPlastic(k), ease.inOut);
  frameFor('open');
  await tween(1.6, k => {
    leftHinge.rotation.y = lerp(0, -Math.PI, k);
    sleeve.position.x = lerp(x0, S / 2, k);
    setSpine(k);
  });
  state = 'open'; busy = false; refreshUI();
}
async function closeSleeve() {
  if (state === 'popped') await putBack();
  busy = true; refreshUI();
  frameFor('closed');
  await tween(1.5, k => {
    leftHinge.rotation.y = lerp(-Math.PI, 0, k);
    sleeve.position.x = lerp(S / 2, 0, k);
    setSpine(1 - k);
  });
  record.visible = false;
  await tween(1.0, k => setPlastic(1 - k), ease.inOut);
  state = 'closed'; busy = false; refreshUI();
}
async function popRecord() {
  busy = true; refreshUI();
  placeRecordInPocket();
  record.visible = true;
  const p0 = pocketPos();
  const up = p0.clone(); up.y = S / 2 + R + 0.12;
  // slide out of the open top of the pocket
  await tween(1.1, k => record.position.lerpVectors(p0, up, k), ease.inOut);
  frameFor('popped');
  // arc forward to the viewer with a full flip so both sides flash by
  const q0 = record.quaternion.clone();
  await tween(1.4, k => {
    record.position.lerpVectors(up, POP_POS, k);
    record.position.z += Math.sin(k * Math.PI) * 0.8;
    record.quaternion.copy(q0).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), k * Math.PI * 2));
  }, ease.inOut);
  record.quaternion.identity();
  state = 'popped'; busy = false; refreshUI();
}
async function putBack() {
  busy = true; refreshUI();
  angVel.set(0, 0, 0);
  const p0 = record.position.clone(), q0 = record.quaternion.clone();
  const up = pocketPos(); up.y = S / 2 + R + 0.12;
  frameFor('open');
  await tween(1.2, k => {
    record.position.lerpVectors(p0, up, k);
    record.quaternion.slerpQuaternions(q0, new THREE.Quaternion(), k);
  });
  const dn = pocketPos();
  await tween(0.9, k => record.position.lerpVectors(up, dn, k));
  state = 'open'; busy = false; refreshUI();
}

/* ---------- pointer: click to open / pop, drag record to rotate ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;
let dragRecord = false;
const angVel = new THREE.Vector3();   // inertia for the record (camera-space axis * speed)
let lastMove = 0;

function setNdc(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function hitRecord() { return record && record.visible && ray.intersectObject(pickRecord, false).length > 0; }
function hitSleeve() { return ray.intersectObjects(pickSleeve, false).length > 0; }

function rotateRecord(dx, dy) {
  // map screen drag to a rotation about camera-space axes → full 360° in any direction
  const speed = 0.009;
  const axisCam = new THREE.Vector3(dy, dx, 0);
  const ang = axisCam.length() * speed;
  if (ang < 1e-6) return;
  axisCam.normalize();
  const axisWorld = axisCam.clone().applyQuaternion(camera.quaternion);
  record.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axisWorld, ang));
}

canvas.addEventListener('pointerdown', e => {
  setNdc(e);
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
  if (state === 'popped' && !busy && hitRecord()) {
    dragRecord = true;
    controls.enabled = false;
    angVel.set(0, 0, 0);
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  }
}, { capture: true });   // run before OrbitControls so it never starts orbiting on a record grab
canvas.addEventListener('pointermove', e => {
  if (down) {
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) down.moved = true;
    if (dragRecord) {
      const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
      rotateRecord(dx, dy);
      const now = performance.now(), dt = Math.max(1, now - lastMove);
      angVel.set(dx / dt * 16, dy / dt * 16, 0);
      lastMove = now;
    }
    down.lx = e.clientX; down.ly = e.clientY;
    return;
  }
  // hover cursor
  setNdc(e);
  const clickable = !busy && ((state !== 'popped' && hitSleeve()) || (state === 'popped' && hitRecord()));
  canvas.classList.toggle('pointer', clickable && state !== 'popped');
});
function endPointer(e) {
  if (!down) return;
  const wasClick = !down.moved;
  if (dragRecord) {
    dragRecord = false;
    controls.enabled = true;
    canvas.classList.remove('dragging');
    if (performance.now() - lastMove > 80) angVel.set(0, 0, 0);
  }
  down = null;
  if (wasClick && !busy && e.type === 'pointerup') {
    setNdc(e);
    if (state === 'closed' && hitSleeve()) openSleeve().then(popRecord);
    else if (state === 'open' && hitSleeve()) popRecord();
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

ui.pop.onclick = () => !busy && state === 'open' && popRecord();
ui.back.onclick = () => !busy && state === 'popped' && putBack();
ui.close.onclick = () => !busy && state !== 'closed' && closeSleeve();
ui.spin.onclick = () => { spinning = !spinning; refreshUI(); };
ui.view.onclick = () => {
  if (state === 'popped' && !busy) {
    const q0 = record.quaternion.clone(); angVel.set(0, 0, 0);
    tween(0.8, k => record.quaternion.slerpQuaternions(q0, new THREE.Quaternion(), k));
  }
  frameFor(state);
};

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let curSpin = 0;
function loop(now) {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  stepTweens(now);
  root.position.y = Math.sin(t * 0.9) * 0.035;
  root.rotation.z = Math.sin(t * 0.6) * 0.004;
  if (record) {
    const want = state === 'popped' && spinning ? spinVel : 0;
    curSpin = lerp(curSpin, want, 1 - Math.exp(-dt * 3));
    recordSpin.rotation.z -= curSpin * dt;
    if (!dragRecord && angVel.lengthSq() > 1e-4) {
      rotateRecord(angVel.x, angVel.y);
      angVel.multiplyScalar(Math.exp(-dt * 3.2));
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

build().then(() => {
  refreshUI();
  const l = document.getElementById('loading'); l.style.opacity = 0;
  requestAnimationFrame(loop);
}).catch(err => {
  document.getElementById('loading').textContent = '加载失败：' + err;
  console.error(err);
});
refreshUI();
</script>
</body>
</html>

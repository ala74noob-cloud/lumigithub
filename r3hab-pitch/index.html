<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R3HAB × 徐明浩 Pitch</title>
<style id="main-style">
/* Layout: 16:9 artist pitch deck — GREENROOM palette (cream slides, ink, pink kicker, lime numbers on dark tiles) */
:root{
  color-scheme:light;
  --app:#e4e2d9; --bar:#1a1b1e; --bar-fg:#ececea; --bar-dim:#9a9a96;
  --paper:#f5f4ef; --card:#ffffff; --ink:#1b1b1d; --gray:#6b6a66; --gray2:#9b9a95; --line:#dcdad1;
  --pink:#e2297c; --lime:#d6ef4f; --limebg:#e0f264; --dark:#1a1b1e; --dark2:#26272b;
  --font:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--app);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--bar-fg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;font-size:13px}
.bar .brand{font-weight:800;letter-spacing:.12em;color:var(--lime);margin-right:8px}
.bar button{font-size:13px;border:1px solid #3a3b41;background:#24252a;color:var(--bar-fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--lime)}
.bar button.on{background:var(--bar-fg);color:var(--bar);border-color:var(--bar-fg)}
.bar button.go{background:var(--limebg);color:#111;border-color:var(--limebg);font-weight:700}
.bar .seg{display:inline-flex}
.bar .seg button:first-child{border-radius:6px 0 0 6px}.bar .seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.bar .status{color:var(--bar-dim);margin-left:auto}
button[data-arm]{border-color:var(--pink)!important;color:#ffb3d1!important}

.stagewrap{padding:20px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hintline{width:min(1280px,100%);font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:8px}
.hintline b{color:var(--ink)}
#deck{width:min(1280px,100%);display:flex;flex-direction:column;gap:6px}
.frame{position:relative}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 8px;font-size:12px;color:var(--gray)}
.fbar .pg{font-weight:800;letter-spacing:.14em;margin-right:auto}
.fbar button{font-size:12px;border:1px dashed var(--pink);background:transparent;color:var(--pink);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700}
.fbar button:hover{background:var(--pink);color:#fff}
.holder{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
body.view .fbar button{display:none}

/* slide */
.slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);transform-origin:0 0;padding:52px 64px 0}
.slide.dark{background:var(--dark);color:#f2f2ee}
.sfoot{position:absolute;left:64px;right:64px;bottom:20px;display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.2em;color:var(--gray2);font-weight:800;text-transform:uppercase}
.sfoot img{width:15px;height:auto}
.sfoot span:last-child{margin-left:auto}
.dark .sfoot{color:#77776f}

.kick{font-size:12.5px;font-weight:800;letter-spacing:.3em;color:var(--pink);text-transform:uppercase}
.dark .kick{color:var(--lime)}
.h2{font-size:34px;line-height:1.15;font-weight:800;margin:8px 0 0;letter-spacing:-.01em}
.h2 .no{color:var(--pink);margin-right:12px}
.desc{font-size:15.5px;line-height:1.6;color:var(--gray);margin:8px 0 0}
.dark .desc{color:#a9a9a5}
.hl{background:var(--limebg);color:var(--ink);padding:0 5px}
.head{height:118px}
.empty-note{font-size:14px;color:var(--gray2);font-style:italic}

.tile{background:var(--dark);color:#fff;border-radius:9px;padding:16px 18px 14px;min-width:0}
.tile .n{font-size:40px;font-weight:800;color:var(--lime);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l{font-size:11px;font-weight:800;letter-spacing:.16em;color:#b4b4b1;margin-top:8px;text-transform:uppercase}
.dark .tile{background:var(--dark2)}
.tiles{display:grid;gap:12px}

/* images keep their ratio: width/height are set together from the image's own aspect ratio */
.pic{display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.08);background:#fff}
.gal{display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%}
.grow{display:flex;justify-content:center;align-items:flex-start;gap:16px}
.cell{display:flex;flex-direction:column;align-items:center;min-width:0}
.cell .pic{flex:none}
.cap{width:100%;font-size:12.5px;line-height:1.4;margin-top:8px;overflow:hidden}
.cap .ct{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .ca{color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.cap .cn{font-weight:800;font-size:15px}
.cap .cn small{font-size:11px;color:var(--gray);margin-left:3px}
.kv{display:grid;grid-template-columns:1fr;column-gap:12px;margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.kv .r{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;padding:2px 0}
.kv .r span:first-child{color:var(--gray)}
.kv .r span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.area{position:absolute;left:64px;right:64px;top:170px;bottom:56px}

/* split slides: text column + picture area */
.split{position:absolute;inset:52px 64px 56px 64px;display:grid;gap:44px}
.split .tx{display:flex;flex-direction:column;min-width:0}
.split .pa{position:relative;min-width:0}
.split .h2{font-size:30px}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bigl{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gray);margin-top:8px;text-transform:uppercase}
.table{border-top:2px solid var(--ink);margin-top:18px}
.dark .table{border-color:#f2f2ee}
.table .r{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.dark .table .r{border-color:#3a3b40}
.table .r .i{color:var(--pink);font-weight:800}
.dark .table .r .i{color:var(--lime)}
.table .r .v{font-weight:800;font-variant-numeric:tabular-nums}
.table.tour .r{grid-template-columns:58px 230px minmax(0,1fr);gap:16px;font-size:inherit;line-height:1.45}
.table.tour{font-size:14px}
.table.tour .r b{font-weight:700}
.badge{background:var(--limebg);color:#111;border-radius:9px;padding:14px 18px}
.badge b{display:block;font-size:18px}
.badge span{font-size:12px;color:#3b3b38}
.plist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.plist .p{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.plist .p span{font-size:14px;font-weight:700}
.plist .p b{font-size:24px}
.dark .plist .p{border-color:#3a3b40}
.feat{display:flex;gap:22px;align-items:flex-start;height:100%}
.feat .info{flex:1;min-width:0}
.feat .t{font-size:24px;font-weight:800;line-height:1.2}
.feat .a{font-size:14px;color:var(--pink);font-weight:700;margin-top:6px}
.feat .kv{grid-template-columns:1fr;margin-top:14px}
.feat .kv .r{font-size:14px;padding:5px 0}
.pf{font-size:20px;font-weight:800;margin-bottom:14px}

/* cover */
.cover{padding:0;background:var(--dark)}
.cover .bg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,18,22,.86) 0%,rgba(18,18,22,.55) 38%,rgba(18,18,22,0) 62%)}
.cover .ctext{position:absolute;left:64px;bottom:70px;width:560px;color:#fff}
.cover .ck{font-size:12.5px;font-weight:800;letter-spacing:.3em;color:var(--lime)}
.cover h1{font-size:60px;line-height:1.06;margin:16px 0 0;font-weight:800}
.cover .cs{font-size:17px;color:#d7d7d2;margin-top:14px;line-height:1.6}
.cover .ctop{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:12px;font-size:11px;font-weight:800;letter-spacing:.28em;color:#fff}
.cover .ctop img{width:34px;height:auto}

/* artist one-pager */
.prof{padding:0;display:grid;grid-template-columns:300px 1fr}
.prof .photo{width:300px;height:720px;display:block}
.prof .pbody{padding:40px 52px 0 44px;display:flex;flex-direction:column;gap:11px;min-width:0}
.prof .pimg{display:none}
.prof .ph{display:block}
.prof .pname{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:6px 0 0}
.prof .ptag{font-size:13.5px;font-weight:700;margin-top:6px}
.prof .pbio{font-size:12px;line-height:1.62;color:#4a4a47;margin:6px 0 0}
.prof .badge{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.prof .badge b{font-size:15px}
.prof .badge span{font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpis .tile{padding:10px 12px}
.kpis .tile .n{font-size:28px}
.kpis .tile .l{font-size:9.5px;margin-top:5px}
.socials{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.socials .s{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 4px;text-align:center}
.socials .s b{display:block;font-size:15px;font-weight:800}
.socials .s span{display:block;font-size:9px;color:var(--gray);margin-top:2px;line-height:1.25}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cols3 h4{font-size:12px;font-weight:800;margin:0 0 4px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.cols3 h4+ul{margin-bottom:8px}
.cols3 ul{margin:0;padding:0;list-style:none}
.cols3 li{font-size:10.8px;line-height:1.42;color:#3e3e3b;padding:2px 0 2px 10px;position:relative}
.cols3 li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;background:var(--pink);border-radius:50%}
.cols3 li b{color:var(--ink)}
.minilbl{font-size:9.5px;font-weight:800;letter-spacing:.2em;color:var(--gray);text-transform:uppercase}

/* proposal */
.prop{display:flex;flex-direction:column;gap:20px}
.prop .rule{display:none}
.prop .intent{font-size:26px;font-weight:800;margin-top:8px}
.prop .minilbl{color:#9b9b97}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.opt{background:var(--dark2);border-radius:10px;padding:26px 28px 28px}
.opt .on{display:inline-block;background:var(--limebg);color:#111;font-weight:800;font-size:12.5px;border-radius:5px;padding:4px 9px}
.opt h4{font-size:28px;margin:16px 0 12px;color:#fff}
.opt p{font-size:17px;line-height:1.75;color:#cfcfcb;margin:0}
.flex-note{font-size:16px;font-weight:700}
.prop .h2{font-size:40px}
.prop .kick{color:var(--lime)}

/* edit affordances */
.editing .f{outline:1px dashed transparent;outline-offset:2px;border-radius:2px;min-width:1.2em;display:inline-block}
.editing .f:hover{outline-color:rgba(226,41,124,.6)}
.editing .f:focus{outline:2px solid var(--pink)}
.editing .f:empty::before{content:attr(data-ph);color:var(--gray2);font-weight:600}
.tile .f:empty::before{color:#77786f}
.editing [data-html] [contenteditable]:hover{outline:1px dashed rgba(226,41,124,.5)}
.dropbox{border:2px dashed #c9c7bd;border-radius:10px;background:#ecebe4;color:#7d7c74;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700;cursor:pointer;line-height:1.6;width:100%;height:100%}
.dropbox small{font-weight:500;font-size:12px;opacity:.85}
.dropbox:hover,.dropbox.over{border-color:var(--pink);color:var(--pink)}
.itemwrap{position:relative}
.itemctl{position:absolute;top:-10px;right:-10px;display:none;gap:4px;z-index:3}
.editing .itemwrap:hover>.itemctl{display:flex}
.itemctl button{width:26px;height:26px;border-radius:50%;border:none;background:var(--dark);color:#fff;font-size:13px;cursor:pointer;line-height:26px;padding:0}
.itemctl button.del{background:var(--pink)}
.editing .pic{cursor:pointer}
.editing .pic:hover{outline:3px solid var(--pink);outline-offset:-3px}
.addrow{font-size:12px;font-weight:700;color:var(--pink);background:none;border:1px dashed var(--pink);border-radius:6px;padding:5px 10px;cursor:pointer;align-self:flex-start;margin-top:8px}

/* auto panel */
.panel{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));max-height:46vh;display:flex;flex-direction:column;background:var(--bar);color:var(--bar-fg);border-radius:10px;box-shadow:0 16px 50px rgba(0,0,0,.35);z-index:60;font-size:13px}
.panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #2d2e33;font-weight:700}
.panel header span{flex:1}
.panel header button{border:none;background:none;color:var(--bar-dim);font-size:18px;cursor:pointer;line-height:1}
.panel ul{list-style:none;margin:0;padding:6px 0;overflow:auto}
.panel li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:7px 14px}
.panel li .th{width:40px;height:40px;border-radius:5px;background:#2a2b30 center/cover no-repeat}
.panel li .nm{color:var(--bar-dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel li .st{font-weight:600}
.panel li.ok .st{color:var(--lime)}
.panel li.err .st{color:#ff9a9a}
.panel li.run .st::after{content:"";display:inline-block;width:10px;height:10px;margin-left:6px;border:2px solid var(--bar-dim);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.panel li.run .st::after{animation:none}}
body.dragging #deck{outline:3px dashed var(--pink);outline-offset:8px}

@page{size:1280px 720px;margin:0}
@media print{
  html,body{background:none}
  .bar,.panel,.hintline,.fbar{display:none!important}
  .stagewrap{padding:0;display:block}
  #deck{width:1280px;display:block}
  .holder{width:1280px!important;height:720px!important;box-shadow:none;border-radius:0}
  .slide{transform:none!important;break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.prof .sfoot{left:344px}
.cols3 li{font-size:11.3px}

/* thank you */
.thanks{padding:0}
.thanks .tphoto{position:absolute;right:0;top:0;width:300px;height:720px;display:block}
.thanks .tbody{position:absolute;left:64px;top:0;bottom:0;width:760px;display:flex;flex-direction:column;justify-content:center}
.thanks .ty{font-size:104px;font-weight:800;letter-spacing:-.02em;line-height:1}
.thanks .tys{font-size:30px;font-weight:800;color:var(--lime);margin-top:26px}
.thanks .tyl{font-size:18px;color:#b9b9b5;margin:14px 0 0;line-height:1.6}
.thanks .tfoot{position:absolute;left:64px;bottom:44px;display:flex;align-items:center;gap:12px;font-size:11px;font-weight:800;letter-spacing:.28em;color:#9b9b98}
.thanks .tfoot img{width:30px;height:auto}
.fit{min-height:0}
</style>
</head>
<body>
<div id="app">
<div class="bar">
  <span class="brand">R3HAB × 徐明浩</span>
  <span class="seg"><button id="mEdit" class="on">编辑</button><button id="mView">预览</button></span>
  <button id="bAuto" class="go">＋ 一键放入截图</button>
  <button id="bPdf">导出 PDF</button>
  <button id="bSave">下载 HTML</button>
  <button id="bReset">清空重来</button>
  <span class="status" id="status"></span>
</div>
<div class="stagewrap">
  <div class="hintline"><b>用法：</b>把截图一次拖到页面上（或点「一键放入截图」/ Ctrl+V 粘贴），自动识别、归到对应页面并读出数字。图片保持原比例，大小按每页内容自动排；一页放不下会自动续页。文字和数字点击即可修改，点图片可换图；每页上方的「＋」可往该页加截图。</div>
  <div id="deck"></div>
</div>
<div class="panel" id="panel" hidden>
  <header><span id="panelTitle">截图识别</span><button id="panelClose" title="关闭">×</button></header>
  <ul id="jobs"></ul>
</div>
<input type="file" id="files" accept="image/*" multiple hidden>
</div>
<script id="baked" type="application/json">{}</script>

/* ---------- justified-row packer ---------- */
function partitions(n,r){
  const out=[];const seq=(a,b)=>Array.from({length:b-a},(_,k)=>a+k);
  const rec=(s,k,acc)=>{if(k===1){out.push([...acc,seq(s,n)]);return;}for(let e=s+1;e<=n-k+1;e++)rec(e,k-1,[...acc,seq(s,e)]);};
  rec(0,r,[]);return out;
}
function rowHeight(ars,ix,W,gap,minW,hcap){
  let hh=hcap;
  for(let it=0;it<5;it++){
    let fixed=0,flex=0;ix.forEach(i=>{if(ars[i]*hh<minW)fixed+=minW;else flex+=ars[i];});
    const avail=W-gap*(ix.length-1)-fixed;
    if(flex===0)return avail>=0?hh:-1;
    if(avail<=0)return -1;
    hh=Math.min(hcap,avail/flex);
  }
  return hh;
}
function pack(ars,o){
  const n=ars.length;let best=null;
  for(let r=1;r<=Math.min(o.maxRows||2,n);r++){
    for(const part of partitions(n,r)){
      const rows=part.map(ix=>({ix,h:rowHeight(ars,ix,o.W,o.gap,o.minW||0,o.hcap)}));
      if(rows.some(x=>x.h<=0))continue;
      const avail=o.H-r*(o.cap||0)-(r-1)*o.rgap;if(avail<=0)continue;
      const common=Math.min(...rows.map(x=>x.h));rows.forEach(x=>x.h=common);
      if(common*r>avail)rows.forEach(x=>x.h=avail/r);
      let area=0,minLong=1e9;
      rows.forEach(x=>x.ix.forEach(i=>{area+=ars[i]*x.h*x.h;minLong=Math.min(minLong,Math.max(ars[i]*x.h,x.h));}));
      if(!best||area>best.area)best={rows,area,minLong};
    }
  }
  return best;
}
function chunk(items,o){
  const pages=[];let cur=[];
  items.forEach(it=>{
    const trial=[...cur,it];const L=pack(trial.map(x=>x.ar),o);
    if(cur.length&&(!L||L.minLong<o.minLong||trial.length>(o.max||99))){pages.push(cur);cur=[it];}
    else cur=trial;
  });
  if(cur.length)pages.push(cur);
  if(pages.length<2)return pages;
  const n=pages.length,even=[];let k=0;
  for(let p=0;p<n;p++){const size=Math.floor(items.length/n)+(p<items.length%n?1:0);even.push(items.slice(k,k+size));k+=size;}
  return even.every(pg=>{const L=pack(pg.map(x=>x.ar),o);return L&&L.minLong>=o.minLong;})?even:pages;
}
function GAL(items,o,cellFn){
  const L=pack(items.map(x=>x.ar),o);

}

/* shrink text in boxes marked .fit until nothing overflows */
function autofit(root){
  root.querySelectorAll('.fit').forEach(el=>{
    let fs=parseFloat(getComputedStyle(el).fontSize)||14,guard=0;
    while(el.scrollHeight>el.clientHeight+1&&fs>9&&guard++<40){fs-=0.5;el.style.fontSize=fs+'px';}
  });
}

/* ================= images ================= */
function toDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(r.error);
    r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('decode'));
      img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.88));};
      img.src=r.result;};
    r.readAsDataURL(file);
  });
}
async function setImage(obj,key,file,type){
  if(!file)return;
  obj[key]=await toDataURL(file);changed(true);
  if(type)autoAdd([file],type,obj);   // read the numbers off it for this item
}

/* drag & drop + paste */
let dragDepth=0;
document.addEventListener('dragenter',e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){dragDepth++;document.body.classList.add('dragging');}});
document.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove('dragging');});
document.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.dropbox.over').forEach(d=>d.classList.remove('over'));const t=e.target.closest&&e.target.closest('.dropbox');if(t)t.classList.add('over');});
document.addEventListener('drop',e=>{
  e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');
  document.querySelectorAll('.dropbox.over').forEach(d=>d.classList.remove('over'));
  const files=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const t=e.target.closest&&e.target.closest('[data-take]');
  if(t&&t._take&&EDIT)t._take(files);else autoAdd(files);
});
document.addEventListener('paste',e=>{
  const imgs=[...((e.clipboardData||{}).items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  if(imgs.length){e.preventDefault();if(hoverTake&&hoverTake._take&&EDIT)hoverTake._take(imgs);else autoAdd(imgs);return;}
  if(e.target.closest&&e.target.closest('[contenteditable]')){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));}
});

type 只能是以下之一，data 字段按说明填写：
- "douyin_tag"：抖音话题/标签页（#话题名，下面有参与人数或作品数、播放量或热度）。data:{"tag":"#话题名","posts":"帖子/作品/参与数","heat":"播放量或热度"}
- "douyin_post"：抖音单条视频（播放页或详情页，侧边有点赞、评论、收藏、分享数）。data:{"likes":"","comments":"","saves":"","shares":"","plays":"","date":"发布日期","title":"视频文案（20字内）","author":"@发布账号"}
- "douyin_profile"：抖音、小红书、微博、B站、视频号、快手等账号主页（有粉丝、获赞）。data:{"platform":"抖音|小红书|微博|哔哩哔哩|视频号|快手|其他","name":"账号名","followers":"","likes":"获赞或获赞与收藏"}
- "netease_songs"：网易云音乐歌曲条目、热门歌曲列表或单曲页（带红心/点赞/收藏数，如 10w+）。data:{"songs":[{"name":"歌名","artists":"艺人","likes":"点赞或收藏数"}]}
- "netease_profile"：网易云音乐艺人主页。data:{"followers":""}
- "qq_profile"：QQ 音乐艺人主页。data:{"followers":""}
- "kugou_profile"：酷狗音乐艺人主页。data:{"followers":""}
- "spotify"：Spotify 页面。data:{"followers":"","monthly_listeners":"","tracks":[{"name":"","plays":""}]}
- "collab_song"：R3HAB 与华语或亚洲艺人合作单曲的页面或成绩。data:{"song":"","artists":"R3HAB × 某某","plays":"","likes":"","platform":"","year":"","note":"榜单等成绩"}
- "tour"：R3HAB 在中国演出的现场照片、海报或票务页。data:{"year":"","city":"","venue":"场地或演出名称"}
- "other"：都不是。data:{"caption":"一句话说明"}

规则：
1. 数字照截图原样抄写，保留单位（万、亿、w、w+、K、M 等），不要换算。
2. 看不到的字段填 ""，绝不编造。
3. 单曲署名同时有 R3HAB 和华语/亚洲艺人时，优先用 "collab_song"。
4. artists / 艺人字段写完整署名，列出全部合作艺人（如 "R3HAB & Mike Williams"）。截图里署名被截断（…）时，只在你确定的情况下补全，不确定就照截图写。
5. 数字只写数字和单位（如 "4738"、"3757.7万"），不要带"人参与""次播放"等文字。`;

const panel=$('panel'),jobsEl=$('jobs'),panelTitle=$('panelTitle');
$('panelClose').onclick=()=>{panel.hidden=true;};
let running=0,doneCount=0,totalCount=0;
function updateTitle(){panelTitle.textContent=running?`识别中 ${doneCount}/${totalCount}`:`已完成 ${doneCount} 张`;}
function jobRow(file){
  const li=h('li',{class:'run'},h('div',{class:'th'}),h('div',null,h('div',{class:'st'},'排队中'),h('div',{class:'nm'},file.name||'粘贴的截图')));
  li.querySelector('.th').style.backgroundImage='url("'+URL.createObjectURL(file)+'")';
  jobsEl.append(li);return li;
}
function setJob(li,t,cls){li.className=cls;li.querySelector('.st').textContent=t;}
const HIDE=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'];

/* files → (optional forced type, optional target item) */
async function autoAdd(files,forceType,target){
  files=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));if(!files.length)return;
  const sample=aiOff?null:await samplePromise;
  let canImg=false;
  if(sample){try{canImg=!!((await sample.limits())||{}).images;}catch(e){}}
  if(!(sample&&canImg)){
    if(target)return;                       // image already set by setImage
    for(const f of files){const url=await toDataURL(f);place(forceType||'other',{},url,null);}
    changed(true);
    if(!forceType)status('当前打开方式无法自动识别，截图已放进「补充截图」，请手动移动');
    return;
  }
  panel.hidden=false;
  const jobs=files.map(f=>({f,li:jobRow(f)}));
  totalCount+=jobs.length;running+=jobs.length;updateTitle();
  let i=0;
  const worker=async()=>{while(i<jobs.length){const j=jobs[i++];await runJob(j,sample,forceType,target);running--;doneCount++;updateTitle();}};
  await Promise.all([worker(),worker(),worker()]);
  changed(true);
}
async function runJob(j,sample,forceType,target){
  let url=null;
  if(!target){try{url=await toDataURL(j.f);}catch(e){setJob(j.li,'图片打不开','err');return;}}
  setJob(j.li,'识别中','run');
  const prompt=forceType?PROMPT+`\n\n已知这张截图的类型是 "${forceType}"，请按该类型读取数据。`:PROMPT;
  try{
    const r=await sample.json(prompt,{images:[j.f]});
    let type=r&&TYPES[r.type]?r.type:'other';
    if(forceType&&!(forceType==='douyin_profile'&&type==='social_profile'))type=forceType;
    place(type,(r&&r.data)||{},url,target);
    setJob(j.li,'✓ '+TYPES[type],'ok');changed(true);
  }catch(e){
    if(HIDE.includes(e&&e.code))aiOff=true;
    if(!target)place(forceType||'other',{},url,null);
    setJob(j.li,(e&&e.code==='rate_limited'?'请求太频繁':e&&e.code==='not_granted'?'未允许使用 Claude':'没能识别')+(target?'，请手动填写':'，已放入'+(forceType?TYPES[forceType]:'补充截图')),'err');
  }
}

/* put recognised data into the state */
function fillIn(o,d){for(const k in d){const v=val(d[k]);if(v&&!val(o[k]))o[k]=v;}}
function place(type,d,url,target){
  d=d||{};
  const withImg=o=>{if(url&&!target)o.img=url;return o;};
  switch(type){
    case 'douyin_tag':{const o=target||withImg({name:'',posts:'',heat:'',img:''});
      let tag=val(d.tag);if(tag&&!tag.startsWith('#'))tag='#'+tag;
      fillIn(o,{name:tag,posts:d.posts,heat:d.heat});if(!target)state.tags.push(o);break;}
    case 'douyin_post':{const o=target||withImg({img:'',title:'',author:'',likes:'',saves:'',comments:'',shares:'',plays:'',date:''});
      let a=val(d.author);if(a&&!a.startsWith('@'))a='@'+a;
      fillIn(o,{title:d.title,author:a,likes:d.likes,saves:d.saves,comments:d.comments,shares:d.shares,plays:d.plays,date:d.date});
      if(!target)state.posts.push(o);break;}
    case 'douyin_profile':case 'social_profile':{const o=target||withImg({platform:'',followers:'',likes:'',img:''});
      fillIn(o,{platform:d.platform||'抖音',name:d.name,followers:d.followers,likes:d.likes});if(!target)state.profiles.push(o);break;}
    case 'netease_songs':{
      const songs=(Array.isArray(d.songs)?d.songs:[]).filter(x=>x&&val(x.name));
      if(target){if(songs[0])fillIn(target,{name:songs[0].name,artists:songs[0].artists,likes:songs[0].likes});break;}
      if(!songs.length){state.songs.push(withImg({name:'',artists:'',likes:'',img:''}));break;}
      songs.forEach((x,k)=>{const o={name:val(x.name),artists:val(x.artists),likes:val(x.likes),img:k===0?url:''};state.songs.push(o);});
      state.songs.sort((a,b)=>(parseNum(b.likes)||0)-(parseNum(a.likes)||0));
      break;}
    case 'netease_profile':case 'qq_profile':case 'kugou_profile':{
      const o=state.platforms[type.split('_')[0]];fillIn(o,{followers:d.followers});
      if(url&&!target){if(!val(o.img))o.img=url;else state.extras.push({img:url,caption:TYPES[type]});}break;}
    case 'spotify':{const sp=state.spotify;
      if(val(d.followers))sp.followers=val(d.followers);if(val(d.monthly_listeners))sp.monthly=val(d.monthly_listeners);
      (Array.isArray(d.tracks)?d.tracks:[]).filter(x=>x&&val(x.name)).forEach(x=>{
        const ex=sp.tracks.find(t=>val(t.name).toLowerCase()===val(x.name).toLowerCase());
        if(ex)fillIn(ex,{plays:x.plays});else sp.tracks.push({name:val(x.name),plays:val(x.plays)});});
      if(url&&!target)sp.imgs.push({img:url});break;}
    case 'collab_song':{const o=target||withImg({song:'',artists:'',plays:'',likes:'',platform:'',year:'',note:'',img:''});
      fillIn(o,{song:d.song,artists:d.artists,plays:d.plays,likes:d.likes,platform:d.platform,year:d.year,note:d.note});
      if(!target)state.collabs.push(o);break;}
    case 'tour':{const T=state.tours;
      if(val(d.year)||val(d.city)||val(d.venue)){
        const blank=T.rows.find(r=>!val(r.year)&&!val(r.city)&&!val(r.venue));
        const r=blank||{year:'',city:'',venue:''};fillIn(r,{year:d.year,city:d.city,venue:d.venue});if(!blank)T.rows.push(r);}
      if(url&&!target)T.imgs.push({img:url});break;}
    default:{if(target){fillIn(target,{caption:d.caption});break;}state.extras.push({img:url,caption:val(d.caption)});}
  }
}

/* ================= export ================= */
function stamp(){return new Date().toISOString().slice(0,10);}
async function deliver(blob,filename){
  const dl=await downloadsPromise;
  if(dl){try{await dl.save({filename,data:blob});status('已保存 '+filename);}catch(e){status(e&&e.code==='declined'?'已取消保存':'保存没成功，请稍后再试');}return;}
  const a=h('a',{href:URL.createObjectURL(blob),download:filename});document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);status('已下载 '+filename);
}
function loadScript(src){return new Promise((res,rej)=>{const s=h('script',{src});s.onload=res;s.onerror=()=>rej(new Error(src));document.head.append(s);});}
/* render a slide with the browser's own engine (SVG foreignObject) so the PDF matches the screen */
let FO_OK=null;
async function slideCanvas(sl,scale){
  const css=$('main-style').textContent.replace(/:root/g,'.fo');
  const c=sl.cloneNode(true);c.style.transform='none';
  c.querySelectorAll('.itemctl,.addrow').forEach(x=>x.remove());
  c.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  const wrap=document.createElement('div');wrap.className='fo';
  wrap.setAttribute('style','width:1280px;height:720px;font-family:'+getComputedStyle(document.body).fontFamily.replace(/"/g,"'")+';-webkit-font-smoothing:antialiased');
  const st=document.createElement('style');st.textContent=css;wrap.append(st,c);
  const xml=new XMLSerializer().serializeToString(wrap);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+1280*scale+'" height="'+720*scale+'" viewBox="0 0 1280 720"><foreignObject x="0" y="0" width="1280" height="720">'+xml+'</foreignObject></svg>';
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
  await new Promise(r=>setTimeout(r,60));
  const cv=document.createElement('canvas');cv.width=1280*scale;cv.height=720*scale;
  const g=cv.getContext('2d');g.fillStyle='#f5f4ef';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
  cv.toDataURL('image/jpeg',0.5); /* throws if the canvas is tainted */
  return cv;
}
async function html2canvasSlide(sl){
  if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const stage=h('div',{style:'position:fixed;left:-20000px;top:0;width:1280px;height:720px;overflow:hidden'});document.body.append(stage);
  const c=sl.cloneNode(true);c.style.transform='none';stage.append(c);
  try{return await window.html2canvas(c,{scale:2,logging:false,width:1280,height:720,backgroundColor:null});}finally{stage.remove();}
}
async function exportPdf(){
  const b=$('bPdf');b.disabled=true;const wasEdit=EDIT;
  try{
    await setMode(false);
    status('正在准备 PDF…');
    if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[1280,720],hotfixes:['px_scaling'],compress:true});
    pdf.setProperties({title:'R3HAB × 徐明浩 单曲合作提案',creator:'GREENROOM.AGENCY'});
    const slides=[...deck.querySelectorAll('.slide')];
    for(let i=0;i<slides.length;i++){
      status(`正在生成 PDF ${i+1}/${slides.length}`);
      let cv=null;
      if(FO_OK!==false){try{cv=await slideCanvas(slides[i],2);FO_OK=true;}catch(e){FO_OK=false;}}
      if(!cv)cv=await html2canvasSlide(slides[i]);
      if(i)pdf.addPage([1280,720],'landscape');
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,1280,720,undefined,'FAST');
    }
    await deliver(pdf.output('blob'),'R3HAB_x_徐明浩_合作提案_'+stamp()+'.pdf');
  }catch(e){
    if(!hasClaude){status('');window.print();}
    else status('PDF 生成失败：请点「下载 HTML」，用电脑浏览器打开后再导出');
  }finally{b.disabled=false;if(wasEdit)setMode(true);}
}
window.__slideCanvas=slideCanvas;
$('bPdf').onclick=exportPdf;
window.__exportPdf=exportPdf;
window.addEventListener('beforeprint',()=>deck.querySelectorAll('.slide').forEach(s=>s.style.transform='none'));
window.addEventListener('afterprint',layout);

function standaloneHTML(){
  const app=$('app').cloneNode(true);
  app.querySelector('#deck').innerHTML='';app.querySelector('#jobs').innerHTML='';
  app.querySelector('#panel').setAttribute('hidden','');app.querySelector('#status').textContent='';
  app.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));app.querySelector('#mEdit').classList.add('on');
  const baked=JSON.stringify({t:Date.now(),state}).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="zh">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>R3HAB × 徐明浩 Pitch</title>\n'
    +$('main-style').outerHTML+'\n</head>\n<body>\n'+app.outerHTML+'\n<script id="baked" type="application/json">'+baked+'<\/script>\n'
    +$('main-script').outerHTML+'\n</body>\n</html>\n';
}
$('bSave').onclick=()=>deliver(new Blob([standaloneHTML()],{type:'text/html'}),'R3HAB_x_徐明浩_合作提案_'+stamp()+'.html');
$('bReset').onclick=e=>{const b=e.currentTarget;
  if(!b.dataset.arm){b.dataset.arm='1';b.textContent='再点一次：清空所有截图和修改';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent='清空重来';}},3500);return;}
  delete b.dataset.arm;b.textContent='清空重来';state=blankState();changed(true);status('已清空');};

/* ================= start ================= */
(async()=>{
  let baked=null;try{baked=JSON.parse($('baked').textContent||'{}');}catch(e){}
  const saved=await dbGet(KEY);
  const pickS=[baked,saved].filter(x=>x&&x.state&&x.t).sort((a,b)=>b.t-a.t)[0];
  if(pickS){state=Object.assign(blankState(),pickS.state);if(saved===pickS)status('已载入上次的编辑');}
  render();
})();
window.__state=()=>state;
})();
